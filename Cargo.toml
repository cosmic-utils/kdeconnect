[workspace]
members = [
    "cosmic-ext-connect-applet",
    "kdeconnect-service",
    "kdeconnect-dbus-client",
    "kdeconnect-core",
    "kdeconnect-varlink",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.103"
async-stream = "0.3.6"
async-trait = "0.1.89"
ashpd = { version = "0.13.12", features = ["file_chooser"] }
ctrlc = "3.5.2"
dirs = "6"
futures = "0.3.32"
futures-util = "0.3.32"
hostname = "0.4.2"
lazy_static = "1.5.0"
mpris = "2.1.0"
notify-rust = "4.18.0"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
pin-project = "1.1.13"
rcgen = "0.14.8"
ron = "0.12.2"
rustls = "0.23.42"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18" }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.5", features = ["v4"] }
varlink = { version = "13.0.0", features = ["tokio"] }
zbus = "5.17.0"
libpulse-binding = { version = "2.30.1" }
tracing-appender = "0.2.5"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

kdeconnect-core = { path = "kdeconnect-core" }
kdeconnect-dbus-client = { path = "kdeconnect-dbus-client" }

libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "wgpu"
    "wayland",
    "winit",
] }
